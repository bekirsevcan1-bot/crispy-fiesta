<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaksiCepte - Antalya</title>
  
  <!-- Leaflet Harita CSS ve JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100vh; z-index: 1; }

    /* Üst Arama / Durum Paneli */
    .top-panel {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 90%;
      max-width: 400px;
    }
    .status-card {
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    /* Konumuma Git Butonu */
    .locate-btn {
      position: absolute;
      bottom: 30px;
      right: 20px;
      z-index: 1000;
      background: #ffcc00;
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 50px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="status-card" id="statusText">
      📍 Canlı konum aranıyor...
    </div>
  </div>

  <button class="locate-btn" onclick="centerUserLocation()">📍 Konumuma Odaklan</button>

  <div id="map"></div>

  <script>
    // 1. Haritayı Varsayılan Olarak Antalya Merkezli Başlat
    const map = L.map('map').setView([36.884804, 30.705623], 13);

    // OpenStreetMap Telif Açık Katmanı
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userMarker = null;
    let userCoords = null;

    // Custom Yolcu/Sürücü İkonu
    const userIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
      iconSize: [36, 36],
      iconAnchor: [18, 36]
    });

    // 2. Canlı Konum Takibi (watchPosition)
    function startLiveTracking() {
      if (!navigator.geolocation) {
        document.getElementById('statusText').innerText = "❌ Tarayıcınız GPS desteklemiyor.";
        return;
      }

      const options = {
        enableHighAccuracy: true, // Yüksek GPS hassasiyeti
        timeout: 10000,           // 10 saniye zaman aşımı
        maximumAge: 0             // Önbellekteki eski konumu kullanma
      };

      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          userCoords = [lat, lng];

          // Haritadaki konumu güncelle veya yeni ekle
          if (userMarker) {
            userMarker.setLatLng(userCoords);
          } else {
            userMarker = L.marker(userCoords, { icon: userIcon }).addTo(map)
              .bindPopup("<b>Mevcut Konumunuz</b>").openPopup();
            map.setView(userCoords, 16); // İlk bulunduğunda konuma zum yap
          }

          document.getElementById('statusText').innerText = "✅ Canlı konum aktif";
        },
        (error) => {
          console.error("GPS Hatası:", error);
          let msg = "⚠️ Konum alınamadı.";
          if (error.code === 1) msg = "⚠️ Lütfen konum izni verin.";
          document.getElementById('statusText').innerText = msg;
        },
        options
      );
    }

    // Konuma Manuel Odaklanma Butonu
    function centerUserLocation() {
      if (userCoords) {
        map.setView(userCoords, 17, { animate: true });
      } else {
        alert("Henüz konumunuz tespit edilemedi. Lütfen konum izinlerini kontrol edin.");
      }
    }

    // Uygulama Başladığında Canlı Takibi Başlat
    startLiveTracking();
  </script>
</body>
</html>
