<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taksi Çepte - Antalya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .list-container {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            padding: 10px;
        }

        .list-item {
            padding: 10px 15px;
            margin: 5px 0;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .list-item:hover {
            background: #f0f4ff;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .list-item.selected {
            background: #667eea;
            color: white;
        }

        .icon {
            font-size: 1.3em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #667eea;
        }

        .stat-box .number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-box .label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .info-box {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #0084ff;
            margin-top: 15px;
        }

        .info-box p {
            color: #333;
            line-height: 1.6;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #ddd;
        }

        .search-box {
            position: relative;
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding-left: 40px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #999;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚕 Taksi Çepte</h1>
            <p>Antalya - Bölge Seçim Sistemi</p>
        </div>

        <div class="content">
            <!-- Sol Panel - Semtler -->
            <div class="section">
                <h2>📍 Semtler</h2>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="ilceSearch" placeholder="Semti ara...">
                </div>
                <div class="list-container">
                    <div id="ilceList"></div>
                </div>
                <div class="stats">
                    <div class="stat-box">
                        <div class="number" id="ilceSayisi">0</div>
                        <div class="label">Toplam Semt</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="mahalleSayisi">0</div>
                        <div class="label">Mahalle</div>
                    </div>
                </div>
            </div>

            <!-- Orta Panel - Mahalleler -->
            <div class="section">
                <h2>🏘️ Mahalleler</h2>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="mahalleSearch" placeholder="Mahalle ara...">
                </div>
                <div class="list-container">
                    <div id="mahalleList"></div>
                </div>
            </div>
        </div>

        <!-- Alt Panel - Sokak/Cadde -->
        <div style="padding: 30px; background: #f8f9fa; border-top: 1px solid #ddd;">
            <div class="section">
                <h2>🛣️ Sokak / Cadde</h2>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="sokakSearch" placeholder="Sokak/Cadde ara...">
                </div>
                <div class="list-container" style="margin-bottom: 15px;">
                    <div id="sokakList"></div>
                </div>
                <div id="selectedInfo" class="info-box" style="display: none;">
                    <p><strong>Seçili Lokasyon:</strong> <span id="selectedLocation"></span></p>
                </div>
                <button onclick="taksiCagir()">🚕 Taksi Çağır</button>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 Taksi Çepte - Antalya Bölge Seçim Sistemi</p>
            <p style="font-size: 0.9em; margin-top: 10px; color: #999;">
                Tüm semtler, mahalleler ve sokaklar sisteme entegre edilmiştir.
            </p>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
