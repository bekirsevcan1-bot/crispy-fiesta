<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Taksi Çepte - Navigasyon Pro</title>

  <!-- 1. Leaflet (Harita) Kütüphanesi -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 2. Leaflet Routing Machine (Rota) Kütüphanesi -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <!-- 3. İkonlar ve Google Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #map { width: 100%; height: 100vh; z-index: 1; }

    /* Üst Arama UI'ı (Sarı İnci Tarzı) */
    .ui-overlay-top {
      position: absolute; top: 15px; left: 15px; right: 15px;
      z-index: 1000; display: flex; flex-direction: column; gap: 8px;
    }

    .header-bar {
      background: #000; color: #fff; border-radius: 12px;
      padding: 15px; font-weight: 600; font-size: 18px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .search-input-group {
      background: #fff; border-radius: 12px;
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .search-input-group i { color: #888; font-size: 18px; }
    .search-input-group input {
      border: none; outline: none; width: 100%;
      font-size: 15px; color: #333;
    }

    /* Alt Kontrol UI'ı */
    .ui-overlay-bottom {
      position: absolute; bottom: 30px; left: 15px; right: 15px;
      z-index: 1000; display: flex; flex-direction: column; gap: 8px;
    }

    .btn-action {
      background: #000; color: #fff; border: none;
      width: 100%; padding: 16px; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .btn-action:hover { background: #222; }

    /* Rota Talimatlar Paneli (Gizli) */
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <!-- Üst Arayüz -->
  <div class="ui-overlay-top">
    <div class="header-bar">
      <span>Taksi Çepte</span>
      <i class="fa-solid fa-bars"></i>
    </div>
    <div class="search-input-group">
      <i class="fa-solid fa-location-dot" style="color: #e74c3c;"></i>
      <input type="text" id="destination" placeholder="Nereye Gidilecek? (Örn: Konyaaltı Beach)">
    </div>
  </div>

  <!-- Harita Alanı -->
  <div id="map"></div>

  <!-- Alt Arayüz -->
  <div class="ui-overlay-bottom">
    <button class="btn-action" onclick="rotaCiz()">
      <i class="fa-solid fa-route"></i> Rota Çiz ve Taksi Ara
    </button>
  </div>

  <script>
    // 1. Haritayı Başlat (Antalya Merkez Odaklı)
    const map = L.map('map', { zoomControl: false }).setView([36.884804, 30.705601], 13);

    // OpenStreetMap Harita Katmanı
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userMarker, destinationMarker, routingControl;

    // 2. Canlı GPS Konumunu Al
    map.locate({setView: true, maxZoom: 16});

    function onLocationFound(e) {
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker(e.latlng).addTo(map).bindPopup("Siz Buradasınız").openPopup();
    }
    map.on('locationfound', onLocationFound);

    function onLocationError(e) {
      alert("Konumunuza erişilemedi, lütfen izin verin.");
    }
    map.on('locationerror', onLocationError);

    // 3. Rota Çizme ve Konum Bulma Fonksiyonu (Gerçek Zamanlı)
    async function rotaCiz() {
      const destination = document.getElementById('destination').value;
      if (!destination) return alert("Lütfen gidilecek yeri yazın!");

      // Adresi koordinata çevir (Geocoding)
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${destination},Antalya`);
      const data = await response.json();
      
      if (data.length > 0) {
        const destCoords = [data[0].lat, data[0].lon];

        // Varsa eski rota ve markerları sil
        if (routingControl) map.removeControl(routingControl);
        if (destinationMarker) map.removeLayer(destinationMarker);

        // Varış noktasına marker ekle
        destinationMarker = L.marker(destCoords).addTo(map).bindPopup(destination).openPopup();

        // Rota çizgisini ekle
        routingControl = L.Routing.control({
          waypoints: [
            userMarker.getLatLng(),
            L.latLng(destCoords)
          ],
          routeWhileDragging: false,
          show: false, // Talimat panelini gizle
          lineOptions: { styles: [{ color: '#2c3e50', opacity: 0.8, weight: 6 }] } // Mavi rota çizgisi
        }).addTo(map);

        alert("Rota çizildi! Taksi sizi bekliyor.");
      } else {
        alert("Konum bulunamadı, daha detaylı yazmayı deneyin (Örn: Konyaaltı Belediyesi).");
      }
    }
  </script>
</body>
</html>
